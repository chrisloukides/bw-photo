<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Black & White Photo Tool</title>
  <style>
    body {
      font-family: -apple-system, sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 40px 20px;
      text-align: center;
      background: white;
      color: #1e3a5f;
      min-height: 100vh;
    }
    h1 {
      font-weight: 300;
      letter-spacing: 0.5px;
    }
    .upload-box {
      border: 1px solid rgba(30, 58, 95, 0.15);
      padding: 40px;
      border-radius: 8px;
      background: rgba(30, 58, 95, 0.03);
      margin: 20px 0;
    }
    .file-label {
      display: inline-block;
      padding: 12px 28px;
      border: none;
      border-radius: 6px;
      background: linear-gradient(to right, #7bb6f0, #1e3a5f);
      color: white;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .file-label:hover {
      background: #1e3a5f;
      color: #7bb6f0;
    }
    #fileInput {
      display: none;
    }
    canvas {
      max-width: 100%;
      margin-top: 20px;
      border-radius: 4px;
    }
    button {
      background: linear-gradient(to right, #7bb6f0, #1e3a5f);
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 15px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 16px;
      transition: background 0.2s ease;
    }
    button:hover:not(:disabled) {
      background: #1e3a5f;
      color: #7bb6f0;
    }
    button:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1>Black & White Photo Tool</h1>
  <div class="upload-box">
    <input type="file" id="fileInput" accept="image/*">
    <label for="fileInput" class="file-label">Choose a photo</label>
  </div>
  <canvas id="canvas"></canvas>
  <br>
  <button id="downloadBtn" disabled>Download Black & White Version</button>

  <script>
    const fileInput = document.getElementById('fileInput');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const downloadBtn = document.getElementById('downloadBtn');

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const img = new Image();
      img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);

        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        for (let i = 0; i < data.length; i += 4) {
          const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
          data[i] = data[i + 1] = data[i + 2] = gray;
        }
        ctx.putImageData(imageData, 0, 0);
        downloadBtn.disabled = false;
      };
      img.src = URL.createObjectURL(file);
    });

    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'bw-photo.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
